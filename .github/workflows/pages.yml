name: Pages

on:
  push:
    branches: [main]
    paths:
      - "miniapps/video-asistan-site/miniapp/client/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Pages'ı yapılandır
        uses: actions/configure-pages@v5

      - name: Siteyi yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: miniapps/video-asistan-site/miniapp/client

      - name: Yayınla
        id: deployment
        uses: actions/deploy-pages@v4
