name: VideoAsistant

options:
  bundleIdPrefix: com.erhanmeydan
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.42"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    GENERATE_INFOPLIST_FILE: YES
    # ffmpeg ve whisper-cli alt süreçlerini çalıştırabilmek için sandbox kapalı.
    ENABLE_APP_SANDBOX: NO
    # Yerel geliştirme için ad-hoc imza.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGNING_ALLOWED: YES
    ENABLE_HARDENED_RUNTIME: NO
    COMBINE_HIDPI_IMAGES: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  VideoAsistant:
    type: application
    platform: macOS
    sources:
      - path: VideoAsistan
    settings:
      base:
        PRODUCT_NAME: VideoAsistant
        PRODUCT_BUNDLE_IDENTIFIER: com.erhanmeydan.videoasistant
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
